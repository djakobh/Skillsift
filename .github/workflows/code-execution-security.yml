name: Code execution security

on:
  pull_request:
    paths:
      - ".github/workflows/code-execution-security.yml"
      - "docker/code-runner/**"
      - "src/app/api/judge/**"
      - "src/app/technical/**"
      - "src/lib/judgeSecurity.ts"
      - "src/lib/judgeHandler.ts"
      - "src/lib/testHarness.ts"
      - "src/lib/vercelSandboxBackend.ts"
      - "scripts/verify-code-sandbox.ts"
      - "tests/judge-security.test.ts"
      - "tests/vercel-sandbox-backend.test.ts"
      - "package.json"
      - "package-lock.json"
  push:
    branches:
      - "codex/harden-code-execution"

permissions:
  contents: read

jobs:
  application-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm
      - run: npm ci
      - run: npm run test:judge

  runner-broker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docker/code-runner/requirements.txt
      - run: python -m pip install --requirement docker/code-runner/requirements.txt
      - run: python -m unittest discover -s docker/code-runner/tests -p "test_*.py"
      - run: docker build --tag skillsift-code-runner:test docker/code-runner
      - name: Verify the broker image does not run as root
        run: test "$(docker image inspect skillsift-code-runner:test --format '{{.Config.User}}')" = "10001:10001"
